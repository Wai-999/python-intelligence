[[task]]
id = "P3-1"
title = "PyMuPDF page extractor with quality scoring and review queue"
owner = "codex"
reviewer = "claude"
depends_on = []
allowed_paths = ["ingest/**", "tests/test_ingest.py"]
acceptance = ["python -m pytest tests/test_ingest.py -q"]
risk = "medium"
max_attempts = 3
brief = """
Create a stdlib + PyMuPDF package `ingest/` (files: ingest/__init__.py, ingest/extract.py, ingest/__main__.py)
and tests in tests/test_ingest.py. PyMuPDF 1.28.2 is installed; import it as `import pymupdf`.
No other new dependencies. You have no network.

Public API in ingest/extract.py:
  QUALITY_THRESHOLD = 0.6
  class IngestError(Exception)
  def sha256_file(path) -> str                      # lowercase hex
  def extract(pdf_path, source_id, out_dir, *, expected_sha256: str) -> dict
      - Raise IngestError if the file's sha256 != expected_sha256 (check BEFORE opening it with pymupdf).
      - Write into out_dir/<source_id>/ exactly three files:
        pages.jsonl  one JSON object per physical page, in order, keys exactly:
            source_id, sha256, page (1-based physical index), label (page.get_label() or null if empty),
            text (page.get_text("text"), normalised: "\\r\\n"/"\\r" -> "\\n", trailing whitespace on each line
            stripped, NUL removed), chars (len of text), extraction_quality (float 0..1, rounded to 3 places),
            flags (sorted list of strings), code_blocks (list of strings: consecutive lines whose spans are all
            in a monospaced font, i.e. span["flags"] & 8, joined with "\\n"; use page.get_text("dict")).
            NO timestamps in pages.jsonl, so re-extracting the same PDF gives byte-identical output.
        meta.json    {source_id, sha256, page_count, extractor: "pymupdf " + pymupdf.__version__,
            toc: doc.get_toc() as a list of [level, title, page], quality: {mean, low_pages (count)},
            review_threshold: QUALITY_THRESHOLD}
        review_queue.json  list of {page, label, extraction_quality, flags} for every page whose
            extraction_quality < QUALITY_THRESHOLD, in page order.
      - Write each file atomically (write to a temp file in the same directory, then os.replace).
      - Return the meta dict.
  def score_page(text: str, has_images: bool) -> tuple[float, list[str]]
      Deterministic heuristic, documented in its docstring. At minimum these flags:
        "no_text"     stripped text empty -> quality 0.0 (add "image_only" too if has_images: likely scanned)
        "sparse"      fewer than 40 non-space chars (quality capped at 0.5)
        "replacement_chars"  any U+FFFD; quality reduced in proportion to their share
        "low_alpha"   share of letters among non-space chars < 0.5 (quality capped at 0.5)
      Normal prose pages must score >= 0.9.

  def extract_from_manifest(manifest_path, out_root, *, only: str | None = None, repo_root=".") -> list[dict]
      For each source in the manifest JSON (key "sources"), or just the one whose source_id == only:
      skip (do not touch) sources unless allowed_for_internal_extraction is true AND downloaded is true;
      otherwise call extract(repo_root/local_path, source_id, out_root, expected_sha256=source["sha256"]).
      If `only` names a source that is not cleared, raise IngestError saying why.

ingest/__main__.py: `python -m ingest --manifest PATH --out DIR [--only SOURCE_ID]` prints one summary line per
source (id, pages, mean quality, pages queued for review) and exits 0; IngestError -> message on stderr, exit 1.

tests/test_ingest.py (pytest, use tmp_path; build fixture PDFs in the test with pymupdf, never read sources/):
  page 1 normal prose (several sentences), page 2 prose plus a code listing inserted with fontname="cour"
  (Courier is monospaced), page 3 blank, page 4 a few characters only; set page labels so get_label works.
  Cover: schema and key set of every pages.jsonl record; code_blocks found on page 2 only; blank page has
  quality 0.0 and flag no_text and is in review_queue.json; sparse page flagged and queued; prose page >= 0.9;
  sha mismatch raises IngestError and writes nothing; re-running gives byte-identical pages.jsonl;
  extract_from_manifest skips uncleared/not-downloaded sources and raises for `only` on an uncleared one;
  CLI exit codes 0 and 1 (run it with subprocess and sys.executable, cwd = the repo root).
Run the tests with the venv interpreter, which has pymupdf:
  "/Users/waiyan/Downloads/My Porfolio/python-intelligence/python_intelligence_cli_package/.venv/bin/python" -m pytest tests/test_ingest.py -q
"""

[[task]]
id = "P3-4"
title = "Extractor hardening: indentation-preserving code blocks, atomic output directory"
owner = "codex"
reviewer = "claude"
depends_on = ["P3-1"]
allowed_paths = ["ingest/**", "tests/test_ingest.py"]
acceptance = ["python -m pytest tests/test_ingest.py -q"]
risk = "medium"
max_attempts = 3
brief = """
Follow-ups from the P3-1 review, in ingest/extract.py (keep the public API and file formats unchanged unless stated).

1. Code blocks must preserve Python indentation. Today page.get_text("dict") lines lose leading whitespace, so
   extracted listings are not valid Python (e.g. a `while` body comes out flush-left). Within a run of code lines,
   compute each line's indent from its first non-space span's bbox x0 relative to the smallest x0 in that run,
   divided by the monospaced character width (span size * 0.6 for Courier-like fonts; or better, measure it with
   pymupdf.Font(...).text_length(" ", fontsize=size) when the font is available), rounded to the nearest whole
   number of spaces. Emit that many leading spaces.
2. A line counts as code when at least 80% of its non-space characters are in monospaced spans (span["flags"] & 8),
   not only when every span is monospaced (real PDFs draw some punctuation in other fonts).
3. A code block ends at a non-code line OR when the vertical gap to the previous code line is more than 1.8x that
   line's height (two listings in a row must stay separate). PyMuPDF block boundaries alone must not split a listing.
4. Output directory swap is atomic as a set: write all three files into a fresh sibling temp directory
   (out_dir/.<source_id>.tmp-<random>), fsync each file, then swap it into place (rename the old directory aside,
   rename the new one in, delete the old). On any failure remove the temp directory and leave the previous
   output untouched. Never leave temp files or directories behind.
5. extract_from_manifest: reject source_ids containing control characters, and reject two cleared sources whose
   ids are equal ignoring case (case-insensitive filesystems would make them overwrite each other).

Tests (build fixture PDFs with pymupdf in the test; never read sources/): a listing inserted line by line with
fontname="cour" at increasing x offsets must come back with 4-space indentation and must compile() as Python;
two listings separated by a large vertical gap give two blocks; one listing inserted as several insert_text calls
with normal line spacing gives ONE block; a code line whose colon is drawn in Helvetica still counts as code;
a failure injected after the first file is written (monkeypatch) leaves the previous output directory byte-identical
and no temp directory behind; case-colliding and control-character ids are rejected.
Run with: "/Users/waiyan/Downloads/My Porfolio/python-intelligence/python_intelligence_cli_package/.venv/bin/python" -m pytest tests/test_ingest.py -q
"""

[[task]]
id = "P3-6"
title = "Extractor follow-ups: indentation edge cases, column listings, Automate code detection"
owner = "codex"
reviewer = "claude"
depends_on = ["P3-4"]
allowed_paths = ["ingest/**", "tests/test_ingest.py"]
acceptance = ["python -m pytest tests/test_ingest.py -q"]
risk = "medium"
max_attempts = 3
brief = """
Follow-ups from the P3-4 review, in ingest/extract.py. Keep file formats and the public API unchanged.

1. Lines without glyph metrics must not use origin 0 in the same coordinate space as measured lines (it drags
   the run's baseline to 0 and adds spurious indentation). Keep their literal leading whitespace instead and
   exclude them from the baseline.
2. Start a new code block when the next code line is ABOVE the previous one or overlaps it vertically
   (a new column or side-by-side listings), not only on a large downward gap.
3. Blank-line gaps inside one listing: two blank lines (PEP 8 between top-level definitions) at normal line
   pitch must NOT split the listing. Use a threshold of more than 3.5 line pitches (measure the pitch from
   consecutive lines in the run when possible; fall back to 1.2 x font size).
4. Monospace detection: some PDFs (e.g. Automate the Boring Stuff) set code in a monospaced font whose
   span["flags"] lacks bit 8. Also treat a span as monospaced when its font name matches (case-insensitive)
   one of: mono, courier, consol, menlo, inconsolata, sourcecodepro, dejavusansmono, lucidaconsole, andale,
   firacode, liberationmono, ubuntumono, roboto mono, or when pymupdf.Font(fontname).is_monospaced is true
   (guard errors: unknown fonts are simply not monospaced by that test).
5. Strip Dive Into Python 3 style callout markers (circled digits U+2460-U+2473 and U+2776-U+277F, plus a
   single preceding space) from the END of code-block lines only; never from page text.
6. Cleanup errors after a successful publish must not abort a batch: log a warning to stderr and continue;
   workspaces lacking target.json that are older than 1 hour are removed during leftover recovery.

Tests (fixture PDFs built with pymupdf, never sources/): items 1-6 each with a regression test; a listing with
two blank lines between two functions stays ONE block and compile()s; two listings side by side (right column
starting higher on the page) give two blocks with correct indentation; a span in a font named e.g.
"SomeMono-Regular" without flag 8 counts as code; callout markers are stripped from code_blocks but kept in text.
Run: "/Users/waiyan/Downloads/My Porfolio/python-intelligence/python_intelligence_cli_package/.venv/bin/python" -m pytest tests/test_ingest.py -q
"""

[[task]]
id = "P3-7"
title = "Extractor: recover Think Python listings and fix block-split edge cases"
owner = "codex"
reviewer = "claude"
depends_on = ["P3-6"]
allowed_paths = ["ingest/**", "tests/test_ingest.py"]
acceptance = [
  "python -m pytest tests/test_ingest.py -q",
  "python scripts/bench_code_blocks.py --pdf-root '/Users/waiyan/Downloads/My Porfolio/python-intelligence/python_intelligence_cli_package' --min pch-think-python-2nd=79 --min pch-diveintopython3=34 --min pch-automate-the-boring-stuff-with-python=36",
]
risk = "medium"
max_attempts = 3
brief = """
P3-6 made code detection work for Automate the Boring Stuff (0 -> 36% parseable listings) but Think Python fell
from 79% to 74.9% parseable. The controller will run scripts/bench_code_blocks.py (read it; do not edit it) on
the real books and requires at least: Think Python 79%, Dive Into Python 3 34%, Automate 36%. You can run it
yourself with the venv interpreter and the --pdf-root shown in the acceptance command; it prints only numbers.

Known causes from the P3-6 review, in ingest/extract.py:
1. A new block starts when the next line's top is at or above the previous line's (delta <= 0.01). That splits
   fragments that share a baseline (MuPDF emits separate `line` entries for far-apart glyph runs, e.g. aligned
   comments) -- likely the Think Python regression. Merge lines whose vertical extents overlap by more than half
   the smaller height into ONE visual line (ordered by x) before deciding on block boundaries; split only when a
   line starts clearly above the previous visual line (a new column), or far below it.
2. Before any pitch has been measured, a large downward gap never splits: apply the 1.2 x font size fallback.
3. A line in another column starting slightly BELOW the previous line must also split: treat a large jump in x
   (> 40% of page width) between consecutive code lines as a new block.
4. Choose the reference span for glyph width / size from spans that contain at least one ASCII character (not a
   lone callout marker).
5. After stripping a callout marker, also strip the trailing spaces before it.
Add a regression test for each item. Do not change file formats or the public API.
"""
